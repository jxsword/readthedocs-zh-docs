version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    pre_build:
      # 显式幂等安装依赖：不依赖 RTD python.install 阶段的确定性（已实测该阶段可能未生效，
      # 导致 sphinx-intl not found Exit 127）
      - python -m pip install --quiet -r upstream/requirements/docs.txt
      - python scripts/gen_upstream_meta.py
      # 用 python -m 模块调用，绕开 venv bin 目录的 PATH 不确定性
      - python -m sphinx_intl build -d locale -l zh_CN
    build:
      # 源目录必须是 upstream/docs（sphinx-multiproject 会拼 PROJECT，
      # 传 upstream/docs/user 会被二次拼接为 user/user 导致无法加载 master doc）
      - python -m sphinx -b html -c . -D language=zh_CN upstream/docs $READTHEDOCS_OUTPUT/html

submodules:
  include: all

python:
  install:
    - requirements: upstream/requirements/docs.txt
