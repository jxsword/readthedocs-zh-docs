version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    pre_build:
      - python scripts/gen_upstream_meta.py
      - sphinx-intl build -d locale -l zh_CN
    build:
      html:
        - sphinx-build -b html -c . -D language=zh_CN upstream/docs/user $READTHEDOCS_OUTPUT/html

submodules:
  include: all

python:
  install:
    - requirements: upstream/requirements/docs.txt
